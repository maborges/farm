name: DeepFarms CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
    inputs:
      full_validation:
        description: Run all component checks for an approved image publication request.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deepfarms-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed-components:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      web: ${{ steps.changes.outputs.web }}
      campo: ${{ steps.changes.outputs.campo }}
      agro: ${{ steps.changes.outputs.agro }}
      any: ${{ steps.changes.outputs.any }}
      matrix: ${{ steps.changes.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine changed image components
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
          HEAD_SHA: ${{ github.sha }}
          FULL_VALIDATION: ${{ inputs.full_validation }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          event = json.loads(Path(os.environ["EVENT_PATH"]).read_text())
          head = os.environ["HEAD_SHA"]
          full = os.environ.get("FULL_VALIDATION", "false").lower() == "true"
          if full or os.environ["EVENT_NAME"] == "workflow_call":
              if subprocess.run(["git", "cat-file", "-e", f"{head}^"], check=False).returncode:
                  base = head
              else:
                  base = subprocess.check_output(["git", "rev-parse", f"{head}^"], text=True).strip()
              args = ["--all"]
          elif os.environ["EVENT_NAME"] == "pull_request":
              base = event["pull_request"]["base"]["sha"]
              args = []
          else:
              base = event.get("before", "")
              if not base or set(base) == {"0"}:
                  args = ["--all"]
                  base = head
              else:
                  args = []

          command = [sys.executable, "scripts/cicd/changed_components.py", "--base", base, "--head", head, "--github-output", os.environ["GITHUB_OUTPUT"], *args]
          subprocess.run(command, check=True)
          PY

  frontend-validation:
    needs: changed-components
    if: >-
      inputs.full_validation == true ||
      needs.changed-components.outputs[matrix.component] == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: web
            filter: web
          - component: campo
            filter: '@agro/campo'
          - component: agro
            filter: agro
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter '${{ matrix.filter }}' typecheck
      - name: Lint
        run: pnpm --filter '${{ matrix.filter }}' lint
      - name: Run Agro unit tests
        if: matrix.component == 'agro'
        run: pnpm --filter agro test
      - name: Run Web static guard tests
        if: matrix.component == 'web'
        run: pnpm --filter web test:sidebar

  cicd-script-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test release guards without Docker or database access
        run: python -m unittest discover -s scripts/cicd/tests -v

  api-postgres-tests:
    needs: changed-components
    if: >-
      inputs.full_validation == true ||
      needs.changed-components.outputs.backend == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/agro-admin-01b2d-postgres-homologacao.yml

  image-build-validation:
    needs: [changed-components, frontend-validation, cicd-script-tests, api-postgres-tests]
    if: >-
      always() &&
      needs.changed-components.result == 'success' &&
      (needs.frontend-validation.result == 'success' || needs.frontend-validation.result == 'skipped') &&
      needs.cicd-script-tests.result == 'success' &&
      (needs.api-postgres-tests.result == 'success' || needs.api-postgres-tests.result == 'skipped') &&
      needs.changed-components.outputs[matrix.component] == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            dockerfile: Dockerfile.backend
          - component: web
            dockerfile: Dockerfile.web
          - component: campo
            dockerfile: Dockerfile.campo
          - component: agro
            dockerfile: Dockerfile.agro
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          tags: deepfarms/${{ matrix.component }}:ci-${{ github.sha }}
