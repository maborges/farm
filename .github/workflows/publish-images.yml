name: Publish DeepFarms images to GHCR

on:
  workflow_dispatch:
    inputs:
      approve_publish:
        description: Confirm publishing changed component images from main after reviewing CI.
        required: true
        type: boolean
        default: false
      base_sha:
        description: Full SHA of last published main release; use 40 zeroes for the first publication.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deepfarms-ghcr-publication-main
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    with:
      full_validation: true

  changed-components:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      web: ${{ steps.changes.outputs.web }}
      campo: ${{ steps.changes.outputs.campo }}
      agro: ${{ steps.changes.outputs.agro }}
      any: ${{ steps.changes.outputs.any }}
      matrix: ${{ steps.changes.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Determine images since last published release
        id: changes
        env:
          HEAD_SHA: ${{ github.sha }}
          BASE_SHA_INPUT: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          base="$BASE_SHA_INPUT"
          all_args=()
          if [[ -z "$base" ]]; then
            echo "base_sha is required" >&2
            exit 2
          elif [[ "$base" =~ ^0{40}$ ]]; then
            base="$HEAD_SHA"
            all_args+=(--all)
          fi
          if [[ ! "$base" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "base_sha must be a full 40-character commit SHA" >&2
            exit 2
          fi
          git merge-base --is-ancestor "$base" "$HEAD_SHA"
          python scripts/cicd/changed_components.py \
            --base "$base" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT" \
            "${all_args[@]}"

  publish:
    needs: [validate, changed-components]
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.approve_publish == true &&
      needs.validate.result == 'success' &&
      needs.changed-components.outputs.any == 'true'
    environment: ghcr-publish
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changed-components.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Check component was changed
        if: needs.changed-components.outputs[matrix.component] != 'true'
        run: echo "No changed files for ${{ matrix.component }}; image publication skipped."
      - name: Set lowercase GHCR owner
        id: package
        if: needs.changed-components.outputs[matrix.component] == 'true'
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: echo "owner=${REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Set up Buildx
        if: needs.changed-components.outputs[matrix.component] == 'true'
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR with job-scoped token
        if: needs.changed-components.outputs[matrix.component] == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable SHA tag
        id: build
        if: needs.changed-components.outputs[matrix.component] == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ steps.package.outputs.owner }}/deepfarms-${{ matrix.component }}:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Write digest manifest
        if: needs.changed-components.outputs[matrix.component] == 'true'
        run: |
          python scripts/cicd/write_release_manifest.py \
            --component '${{ matrix.component }}' \
            --image 'ghcr.io/${{ steps.package.outputs.owner }}/deepfarms-${{ matrix.component }}' \
            --digest '${{ steps.build.outputs.digest }}' \
            --commit '${{ github.sha }}' \
            --output release-manifest.json
      - name: Upload immutable release manifest
        if: needs.changed-components.outputs[matrix.component] == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.component }}-${{ github.sha }}
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 90
